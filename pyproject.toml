[project]
name = "pretalx-extratags"
version = "0.1.0"
requires-python = ">=3.13"

[project.entry-points."pretalx.plugin"]
pretalx_extratags = "pretalx_extratags"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pretalx_extratags"]
